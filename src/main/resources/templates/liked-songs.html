<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/base-layout}">
<main class="content" layout:fragment="content">
    <div class="content-inner">
        <h1 class="page-title">좋아요한 곡</h1>
        <p class="page-sub">하트를 누르면 목록에서 사라져요.</p>

        <div id="liked-song-container" class="song-list">
            <div class="empty-msg" th:if="${likedSongs == null || #lists.isEmpty(likedSongs.items)}">
                <p>좋아요 표시한 곡이 없습니다.</p>
            </div>

            <div th:each="song : ${likedSongs.items}" class="record" th:data-song-id="${song.songId}">
                <div class="record-left">
                    <img th:src="${(song.image == null || song.image == 'null' || song.image == '')
                                    ? '/images/basicProfileCat.png' : song.image}" alt="앨범 커버" class="album-cover" />

                    <div class="song-info">
                        <div class="song-title" th:text="${song.title}">노래 제목</div>
                        <div class="song-uploader" th:text="${song.uploader}">가수 이름</div>
                    </div>
                </div>

                <button type="button" class="play-btn" aria-label="Discord에서 재생">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5Z"/></svg>
                    <span>Discord 재생</span>
                </button>
                <button class="like-btn liked" th:data-song-id="${song.songId}"
                    onclick="toggleLike(this); removeRecordIfUnliked(this);" aria-label="좋아요">
                </button>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="script">
    <script src="/js/likedSongs.js"></script>
</th:block>

</html>
