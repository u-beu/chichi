<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/base-layout}">
<main class="content" layout:fragment="content">
    <div class="content-inner">
        <h1 class="page-title">최근 재생한 곡</h1>
        <p class="page-sub">Discord 음성채널에서 재생한 곡이 바로 올라와요.</p>

        <div id="song-list-container" class="song-list">
            <div id="no-records-msg" class="empty-msg" th:if="${records == null || #lists.isEmpty(records.items)}">
                <p>최근 재생한 곡이 없습니다.</p>
            </div>

            <div th:each="record : ${records.items}" class="record" th:data-song-id="${record.songId}">
                <div class="record-left">
                    <img th:src="${(record.image == null || record.image == 'null' || record.image == '')
                                    ? '/images/basicProfileCat.png' : record.image}" alt="앨범" class="album-cover" />
                    <div class="song-info">
                        <div class="song-title" th:text="${record.title}">노래 제목</div>
                        <div class="song-uploader" th:text="${record.uploader}">가수 이름</div>
                    </div>
                </div>
                <button type="button" class="play-btn" aria-label="Discord에서 재생">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.7l-12-7.5A1 1 0 0 0 7 4.5Z"/></svg>
                    <span>Discord 재생</span>
                </button>
                <button class="like-btn" th:classappend="${record.liked} ? ' liked' : ''" th:data-song-id="${record.songId}"
                    onclick="toggleLike(this)" aria-label="좋아요"></button>
            </div>
        </div>
    </div>
</main>

<th:block layout:fragment="script">
    <script src="/js/recentSongs.js"></script>
</th:block>

</html>
