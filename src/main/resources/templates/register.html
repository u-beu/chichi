<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHICHI Bot - 회원 등록</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">

<main class="auth-card">
    <img th:src="@{/images/logo.png}" alt="CHICHI 로고" class="auth-logo">
    <h1 class="auth-title">회원 등록</h1>
    <p class="auth-sub">서비스 이용을 위해 PIN을 등록해주세요.</p>

    <form method="post" th:action="@{/register/pin}" autocomplete="off">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="text" id="username" th:value="${username}" readonly aria-label="Discord 사용자명">
        <input type="password" id="pin"
               name="pin"
               placeholder="PIN (숫자 6자리)"
               maxlength="6"
               pattern="[0-9]{6}"
               inputmode="numeric"
               aria-label="PIN"
               required>
        <button type="submit" class="auth-btn">등록하기</button>
    </form>

    <p class="auth-foot">Powered by Discord</p>
</main>

</body>
</html>
